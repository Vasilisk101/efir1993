вархив Москвы / Mos.ru","contextUrl":"https://www.mos.ru/news/item/99953073/","contextLabel":"Публикация Правительства Москвы","licenseUrl":"https://creativecommons.org/licenses/by/4.0/"},{"id":"election-leaflets","title":"Листовки первых выборов в Госдуму","type":"press","typeLabel":"Агитация","date":"Кампания 1993","summary":"Коллекция политической агитации из фондов Государственной публичной исторической библиотеки.","detail":"Две отдельные листовки из фонда ГПИБ: движение «Женщины России» и КПРФ, [Москва], [1993]. По ссылкам — библиографические описания.","source":"Государственная публичная историческая библиотека России","originalUrl":"https://merge.dlibrary.org/ru/nodes/200013430-golosuyte-za-kandidatov-dvizheniya-zhenschiny-rossii","credit":"ГПИБ России / фонды агитационной печати","contextUrl":"https://merge.dlibrary.org/ru/nodes/200013412-uvazhaemye-izbirateli-kommunisticheskaya-partiya-rossiyskoy-federatsii-partiya-mira-i-stabilnosti","contextLabel":"Описание листовки КПРФ"},{"id":"cik-resolution","title":"Постановление ЦИК № 142","type":"document","typeLabel":"Документ","date":"20.12.1993","summary":"Постановление об итогах всенародного голосования: за принятие Конституции — 58,4% участников.","detail":"Скан постановления ЦИК Российской Федерации № 142 от 20 декабря 1993 года. Цифры из текста документа: 32 937 630 голосов «за» и 23 431 333 «против». Электронная перепечатка бюллетеня ЦИК 1994 года помечена издателем как неофициальная.","source":"ЦИК Российской Федерации / цифровая копия Wikimedia Commons","originalUrl":"https://commons.wikimedia.org/wiki/File:Постановление_ЦИК_РФ_«О_результатах_всенародного_голосования_по_проекту_Конституции_Российской_Федерации».jpg","imageData":"images/webp-568a308b0bfc.webp","credit":"Центральная избирательная комиссия РФ / Wikimedia Commons","contextUrl":"https://bcik.rf.org.ru/1994/1/","contextLabel":"Бюллетень ЦИК 1994 года (неофициальная электронная версия)"},{"id":"tula-theatre","title":"«Таких бы театров, да побольше»","type":"press","typeLabel":"Библиографическая запись","date":"16.10.1993","summary":"С. Гончаров писал о тульском театре «У Толстовской заставы». Статья вышла в газете «Тула вечерняя» 16 октября 1993 года.","detail":"Отдел краеведения Центральной городской библиотеки имени Л. Н. Толстого включил фрагмент статьи в дайджест «Лев Толстой на тульской сцене». В архиве доступна выдержка. Оригинальную полосу ещё предстоит найти.","source":"МУК «Тульская библиотечная система» · Центральная городская библиотека им. Л. Н. Толстого","originalUrl":"https://tbclib.ru/assets/template/resourses/kraeved/tolstoy_na_tulskoy_scene.pdf","quote":"Ведь моральная, дружеская поддержка очень нужна этому театру.","credit":"С. Гончаров / «Тула вечерняя»"},{"id":"spare-parts","title":"«Почем запчасти?»","type":"press","typeLabel":"Журнальная статья","date":"Октябрь 1993","summary":"В октябрьском выпуске В. Субботин сравнивает московские коммерческие цены на запчасти. Таблица отражает июль 1993 года.","detail":"Изменение цен автор оценивал в рублях, а значения в таблице пересчитал в доллары США. Для неё журнал указал курс 1100 рублей за доллар.","source":"«За рулём», № 10, октябрь 1993 года, с. 10–11","originalUrl":"https://www.zr.ru/archive/zr/1993/10/pochiem-zapchasti","credit":"В. Субботин / «За рулём»"}]</script><script>

function switchLook(name){
 current=name;digits='';const config=looks[name];
 document.querySelectorAll('[data-style]').forEach(b=>{const active=b.dataset.style===name;b.setAttribute('aria-pressed',String(active));get('art-'+b.dataset.style).hidden=!active});
 get('zones').replaceChildren();get('touch').replaceChildren();get('hint').textContent=config.hint;
 contents.forEach((item,i)=>{const label=(name==='txt'?item.code+' ':'')+item.name;
 get('zones').append(zone(label,config.rows[i],()=>showRecord(item.id)));
 const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',()=>showRecord(item.id));get('touch').append(b)});
 for(const [title,id,...rect] of config.extra)get('zones').append(zone(title,rect,()=>showRecord(id)));
 get('zones').append(zone('Указатель архива',config.index,openFind));
 get('box').dataset.look=name;get('dlabel').textContent=config.label+' · Эфир 1993';
}
function openBox(){
 if(!get('box').open){priorFocus=document.activeElement;get('box').showModal()}
}
function openFind(){
 digits='';fromResults=false;get('find').hidden=false;get('read').hidden=true;openBox();refreshFind();get('query').focus();
}
function fold(str){return str.toLowerCase().replaceAll('ё','е').replace(/[«».,:;!?–—/()]/g,' ').replace(/\s+/g,' ').trim()}
const monthNames=['','январь января','февраль февраля','март марта','апрель апреля','май мая','июнь июня','июль июля','август августа','сентябрь сентября','октябрь октября','ноябрь ноября','декабрь декабря'];
const searchData=new Map(records.map(r=>{
 const date=r.date.match(/(\d\d)\.(\d\d)\.(\d{4})/);
 const extra=date?date[1]+' '+monthNames[Number(date[2])]+' '+date[3]:'';
 const names={photo:'фото фотография фотографии',press:'пресса газета журнал агитация',document:'документ документы',video:'видео телевидение фильм кинохроника',artifact:'предмет предметы деньги'};
 return [r.id,fold([r.title,r.typeLabel,r.date,extra,r.summary,r.detail,r.credit,r.source,names[r.type],contents.find(x=>x.id===r.id)?.name||'',contents.find(x=>x.id===r.id)?.code||''].filter(Boolean).join(' '))]
}));
function refreshFind(){
 const words=fold(get('query').value).split(' ').filter(Boolean),kind=get('kind').value;
 const found=records.filter(r=>(!kind||r.type===kind)&&words.every(w=>searchData.get(r.id).includes(w)));
 get('count').textContent=found.length?'Найдено '+found.length+' из '+records.length:'Совпадений нет. Измените запрос или вид материала.';
 const list=get('matches');list.replaceChildren();for(const r of found){
 const li=document.createElement('li'),btn=document.createElement('button'),name=document.createElement('span'),meta=document.createElement('small');btn.type='button';name.textContent=titleFor(r);meta.textContent=r.date+' · '+r.typeLabel;btn.dataset.result=r.id;btn.append(name,meta);btn.addEventListener('click',()=>showRecord(r.id,true));li.append(btn);list.append(li)}
}
function showRecord(id,fromSearch=false){
 const r=archive.get(id);if(!r)return;digits='';fromResults=fromSearch;activeResult=id;get('find').hidden=true;get('read').hidden=false;
 get('headline').textContent=titleFor(r);get('date').textContent=r.date+' · '+r.typeLabel;get('summary').textContent=r.summary;
 get('quote').hidden=!r.quote;get('quote').textContent=r.quote?'«'+r.quote.replace(/\.$/,'')+'».':'';
 get('detail').textContent=r.detail;get('source').textContent=r.source;get('primary').href=r.originalUrl;
 get('primary').textContent=id==='tula-theatre'?'Открыть библиотечный дайджест ↗':id==='spare-parts'?'Открыть полосы «За рулём» ↗':r.type==='video'?'Смотреть в Президентской библиотеке ↗':'Открыть источник ↗';
 get('related').hidden=!r.contextUrl;if(r.contextUrl){get('related').href=r.contextUrl;get('related').textContent=(r.contextLabel||'Материал по теме')+' ↗'}
 get('lic').hidden=!r.licenseUrl;if(r.licenseUrl)get('lic').href=r.licenseUrl;
 get('pictured').hidden=!r.imageData;if(r.imageData){get('illustration').src=r.imageData;get('illustration').alt=r.title;get('credit').textContent=r.credit}else get('illustration').removeAttribute('src');
 get('go-back').hidden=!fromSearch;openBox();get('box').scrollTop=0;get('headline').focus({preventScroll:true});
}
function backToFind(){openFind();const result=get('matches').querySelector('[data-result="'+activeResult+'"]');if(result)result.focus()}
function initial(){const name=location.hash.slice(1);switchLook(Object.hasOwn(looks,name)?name:'journal')}
document.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>{switchLook(b.dataset.style);history.replaceState(null,'','#'+b.dataset.style)}));
get('search-open').addEventListener('click',openFind);get('query').addEventListener('input',refreshFind);get('kind').addEventListener('change',refreshFind);get('query').addEventListener('keydown',e=>{if(e.key==='Enter'){const results=get('matches').querySelectorAll('button');if(results.length===1){e.preventDefault();results[0].click()}}});
get('go-back').addEventListener('click',backToFind);get('dismiss').addEventListener('click',()=>get('box').close());
get('box').addEventListener('cancel',e=>{if(!get('read').hidden&&fromResults){e.preventDefault();backToFind()}});
get('box').addEventListener('close',()=>{if(priorFocus?.isConnected)priorFocus.focus({preventScroll:true})});
get('expand').addEventListener('click',()=>{get('zoom-art').src=get('art-'+current).src;get('zoom-art').alt=get('art-'+current).alt;get('zoom').showModal()});get('shrink').addEventListener('click',()=>get('zoom').close());
document.addEventListener('keydown',e=>{if(current!=='txt'||get('box').open||get('zoom').open||e.ctrlKey||e.metaKey||e.altKey||!/^\d$/.test(e.key))return;
 const now=Date.now();digits=(now-lastDigit>2000?'':digits)+e.key;lastDigit=now;if(digits.length===3){const item=contents.find(x=>x.code===digits);digits='';if(item)showRecord(item.id)}});
window.addEventListener('hashchange',initial);initial();
</script></body></html>
