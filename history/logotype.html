вархив Москвы / Mos.ru","contextUrl":"https://www.mos.ru/news/item/99953073/","contextLabel":"Публикация Правительства Москвы","licenseUrl":"https://creativecommons.org/licenses/by/4.0/"},{"id":"election-leaflets","title":"Листовки первых выборов в Госдуму","type":"press","typeLabel":"Агитация","date":"Кампания 1993","summary":"Коллекция политической агитации из фондов Государственной публичной исторической библиотеки.","detail":"Две отдельные листовки из фонда ГПИБ: движение «Женщины России» и КПРФ, [Москва], [1993]. По ссылкам — библиографические описания.","source":"Государственная публичная историческая библиотека России","originalUrl":"https://merge.dlibrary.org/ru/nodes/200013430-golosuyte-za-kandidatov-dvizheniya-zhenschiny-rossii","credit":"ГПИБ России / фонды агитационной печати","contextUrl":"https://merge.dlibrary.org/ru/nodes/200013412-uvazhaemye-izbirateli-kommunisticheskaya-partiya-rossiyskoy-federatsii-partiya-mira-i-stabilnosti","contextLabel":"Описание листовки КПРФ"},{"id":"cik-resolution","title":"Постановление ЦИК № 142","type":"document","typeLabel":"Документ","date":"20.12.1993","summary":"Постановление об итогах всенародного голосования: за принятие Конституции — 58,4% участников.","detail":"Скан постановления ЦИК Российской Федерации № 142 от 20 декабря 1993 года. Цифры из текста документа: 32 937 630 голосов «за» и 23 431 333 «против». Электронная перепечатка бюллетеня ЦИК 1994 года помечена издателем как неофициальная.","source":"ЦИК Российской Федерации / цифровая копия Wikimedia Commons","originalUrl":"https://commons.wikimedia.org/wiki/File:Постановление_ЦИК_РФ_«О_результатах_всенародного_голосования_по_проекту_Конституции_Российской_Федерации».jpg","imageData":"images/webp-568a308b0bfc.webp","credit":"Центральная избирательная комиссия РФ / Wikimedia Commons","contextUrl":"https://bcik.rf.org.ru/1994/1/","contextLabel":"Бюллетень ЦИК 1994 года (неофициальная электронная версия)"},{"id":"tula-theatre","title":"«Таких бы театров, да побольше»","type":"press","typeLabel":"Библиографическая запись","date":"16.10.1993","summary":"С. Гончаров писал о тульском театре «У Толстовской заставы». Статья вышла в газете «Тула вечерняя» 16 октября 1993 года.","detail":"Отдел краеведения Центральной городской библиотеки имени Л. Н. Толстого включил фрагмент статьи в дайджест «Лев Толстой на тульской сцене». В архиве доступна выдержка. Оригинальную полосу ещё предстоит найти.","source":"МУК «Тульская библиотечная система» · Центральная городская библиотека им. Л. Н. Толстого","originalUrl":"https://tbclib.ru/assets/template/resourses/kraeved/tolstoy_na_tulskoy_scene.pdf","quote":"Ведь моральная, дружеская поддержка очень нужна этому театру.","credit":"С. Гончаров / «Тула вечерняя»"},{"id":"spare-parts","title":"«Почем запчасти?»","type":"press","typeLabel":"Журнальная статья","date":"Октябрь 1993","summary":"В октябрьском выпуске В. Субботин сравнивает московские коммерческие цены на запчасти. Таблица отражает июль 1993 года.","detail":"Изменение цен автор оценивал в рублях, а значения в таблице пересчитал в доллары США. Для неё журнал указал курс 1100 рублей за доллар.","source":"«За рулём», № 10, октябрь 1993 года, с. 10–11","originalUrl":"https://www.zr.ru/archive/zr/1993/10/pochiem-zapchasti","credit":"В. Субботин / «За рулём»"}]</script>

const monthNames=['','январь января','февраль февраля','март марта','апрель апреля','май мая','июнь июня','июль июля','август августа','сентябрь сентября','октябрь октября','ноябрь ноября','декабрь декабря'];
const searchData=new Map(records.map(r=>{
 const date=r.date.match(/(\d\d)\.(\d\d)\.(\d{4})/);
 const extra=date?date[1]+' '+monthNames[Number(date[2])]+' '+date[3]:'';
 const names={photo:'фото фотография фотографии',press:'пресса газета журнал агитация',document:'документ документы',video:'видео телевидение фильм кинохроника',artifact:'предмет предметы деньги'};
 return [r.id,fold([r.title,r.typeLabel,r.date,extra,r.summary,r.detail,r.credit,r.source,names[r.type],contents.find(x=>x.id===r.id)?.name||'',contents.find(x=>x.id===r.id)?.code||''].filter(Boolean).join(' '))]
}));
function refreshFind(){
 const words=fold(get('query').value).split(' ').filter(Boolean),kind=get('kind').value;
 const found=records.filter(r=>(!kind||r.type===kind)&&words.every(w=>searchData.get(r.id).includes(w)));
 get('count').textContent=found.length?'Найдено '+found.length+' из '+records.length:'Совпадений нет. Измените запрос или вид материала.';
 const list=get('matches');list.replaceChildren();for(const r of found){
 const li=document.createElement('li'),btn=document.createElement('button'),name=document.createElement('span'),meta=document.createElement('small');btn.type='button';name.textContent=titleFor(r);meta.textContent=r.date+' · '+r.typeLabel;btn.dataset.result=r.id;btn.append(name,meta);btn.addEventListener('click',()=>showRecord(r.id,true));li.append(btn);list.append(li)}
}
function showRecord(id,fromSearch=false){
 const r=archive.get(id);if(!r)return;digits='';fromResults=fromSearch;activeResult=id;get('find').hidden=true;get('read').hidden=false;
 get('headline').textContent=titleFor(r);get('date').textContent=r.date+' · '+r.typeLabel;get('summary').textContent=r.summary;
 get('quote').hidden=!r.quote;get('quote').textContent=r.quote?'«'+r.quote.replace(/\.$/,'')+'».':'';
 get('detail').textContent=r.detail;get('source').textContent=r.source;get('primary').href=r.originalUrl;
 get('primary').textContent=id==='tula-theatre'?'Открыть библиотечный дайджест ↗':id==='spare-parts'?'Открыть полосы «За рулём» ↗':r.type==='video'?'Смотреть в Президентской библиотеке ↗':'Открыть источник ↗';
 get('related').hidden=!r.contextUrl;if(r.contextUrl){get('related').href=r.contextUrl;get('related').textContent=(r.contextLabel||'Материал по теме')+' ↗'}
 get('lic').hidden=!r.licenseUrl;if(r.licenseUrl)get('lic').href=r.licenseUrl;
 get('pictured').hidden=!r.imageData;if(r.imageData){get('illustration').src=r.imageData;get('illustration').alt=r.title;get('credit').textContent=r.credit}else get('illustration').removeAttribute('src');
 get('go-back').hidden=!fromSearch;openBox();get('box').scrollTop=0;get('headline').focus({preventScroll:true});
}
function backToFind(){openFind();const result=get('matches').querySelector('[data-result="'+activeResult+'"]');if(result)result.focus()}
function addZone(label, rect, action) {
  const zone = document.createElement('button');
  const [left, top, width, height] = rect;
  Object.assign(zone.style, {left:left+'%', top:top+'%', width:width+'%', height:height+'%'});
  zone.type = 'button';
  zone.className = 'zone';
  zone.title = label;
  zone.setAttribute('aria-label', label);
  zone.addEventListener('click', action);
  get('zones').append(zone);
}
for (const item of contents) {
  const action = () => showRecord(item.id);
  addZone(item.code+' '+item.name, item.rect, action);
  const button = document.createElement('button');
  button.type = 'button';
  for (const value of [item.code, item.name]) {
    const part = document.createElement('span');
    part.textContent = value;
    button.append(part);
  }
  button.setAttribute('aria-label', item.code+' '+item.name);
  button.addEventListener('click', action);
  get('touch').append(button);
}
addZone('Выбрать страницу 203', [3.5,84,50.5,11], () => showRecord('tula-theatre'));
addZone('Назад к указателю архива', [56.7,84,40.5,11], openFind);
get('dlabel').textContent = 'Телетекст · Эфир 1993';
get('search-open').addEventListener('click',openFind);get('query').addEventListener('input',refreshFind);get('kind').addEventListener('change',refreshFind);get('query').addEventListener('keydown',e=>{if(e.key==='Enter'){const results=get('matches').querySelectorAll('button');if(results.length===1){e.preventDefault();results[0].click()}}});
get('go-back').addEventListener('click',backToFind);get('dismiss').addEventListener('click',()=>get('box').close());
get('box').addEventListener('cancel',e=>{if(!get('read').hidden&&fromResults){e.preventDefault();backToFind()}});
get('box').addEventListener('close',()=>{if(priorFocus?.isConnected)priorFocus.focus({preventScroll:true})});
get('expand').addEventListener('click', () => {
  get('zoom-panel').append(get('screen'));
  get('zoom').showModal();
  get('zoom-panel').scrollTo(0,0);
});
get('shrink').addEventListener('click', () => get('zoom').close());
get('zoom').addEventListener('close', () => {
  get('screen-home').append(get('screen'));
  get('expand').focus({preventScroll:true});
});
document.addEventListener('keydown', event => {
  if (get('box').open || event.ctrlKey || event.metaKey || event.altKey || !/^\d$/.test(event.key)) return;
  const now = Date.now();
  digits = (now-lastDigit>2000 ? '' : digits) + event.key;
  lastDigit = now;
  if (digits.length === 3) {
    const item = contents.find(item => item.code === digits);
    digits = '';
    if (item) showRecord(item.id);
  }
});
</script></body></html>
